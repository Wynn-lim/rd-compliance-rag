<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研发合规知识库 · 分层检索演示</title>
<style>
:root{
  --ink-0:#0E1319; --ink-1:#151B24; --ink-2:#1B232E; --ink-3:#232D39;
  --line:#28323E; --paper:#E6E2D9; --dim:#9AA3AE; --faint:#66707C;
  --seal:#C8442E; --seal-soft:rgba(200,68,46,.12); --jade:#4A9C85; --jade-soft:rgba(74,156,133,.12);
  --l-route:#7A8FA6; --l-knowledge:#4E7CA8; --l-errata:#4A9C85;
  --l-ledger:#C8442E; --l-method:#8A7FA8; --l-log:#5A6470;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink-0);color:var(--paper);font:13.5px/1.75 var(--sans);
  background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:32px 32px}
header{background:var(--ink-1);border-bottom:1px solid var(--line);padding:0 22px;
  height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.sealmark{width:23px;height:23px;border:1.5px solid var(--seal);border-radius:2px;
  display:grid;place-items:center;font-family:var(--serif);font-size:12px;color:var(--seal);font-weight:700}
.brand{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.4px}
.brand em{font-style:normal;color:var(--seal)}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);
  border-radius:2px;padding:2px 8px;margin-left:auto;white-space:nowrap}
.wrap{display:grid;grid-template-columns:250px 1fr 400px;height:calc(100vh - 56px)}
@media(max-width:1180px){.wrap{grid-template-columns:200px 1fr;}.aside{display:none}}
@media(max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.qlist{position:static!important;
  max-height:none!important;border-right:0!important;border-bottom:1px solid var(--line)}}
.qlist{background:var(--ink-1);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.qlist h3,.aside h3{font-family:var(--serif);font-size:11.5px;color:var(--faint);letter-spacing:1px;
  margin:0 0 10px;padding:0 6px}
.qitem{border:1px solid transparent;border-left:2px solid var(--line);border-radius:2px;
  padding:8px 10px;margin-bottom:4px;cursor:pointer;background:transparent}
.qitem:hover{background:var(--ink-2)}
.qitem.on{border-left-color:var(--seal);background:var(--ink-2)}
.qitem .qi{font-family:var(--mono);font-size:10px;color:var(--faint)}
.qitem .qt{font-size:12px;color:var(--dim);line-height:1.5;margin-top:2px}
.qitem.on .qt{color:var(--paper)}
main{overflow-y:auto;padding:24px 22px}
.inner{max-width:720px;margin:0 auto}
.hero{border:1px solid var(--line);border-left:2px solid var(--seal);background:var(--ink-1);
  border-radius:2px;padding:16px 18px;margin-bottom:20px}
.hero h1{font-family:var(--serif);font-size:15px;margin:0 0 8px}
.hero p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.8}
.hero b{color:var(--paper)}
.qq{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0 0 4px}
.qmeta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:18px}
.readout{background:var(--ink-1);border:1px solid var(--line);border-radius:2px;
  padding:12px 15px;margin-bottom:16px;font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:2}
.readout .layers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ltag{font-family:var(--sans);font-size:11px;padding:1px 8px;border-radius:2px;border:1px solid}
.l-route{border-color:var(--l-route);color:var(--l-route);background:rgba(122,143,166,.1)}
.l-knowledge{border-color:var(--l-knowledge);color:var(--l-knowledge);background:rgba(78,124,168,.1)}
.l-errata{border-color:var(--jade);color:var(--jade);background:var(--jade-soft)}
.l-ledger{border-color:var(--l-ledger);color:var(--l-ledger);background:var(--seal-soft)}
.l-method{border-color:var(--l-method);color:var(--l-method);background:rgba(138,127,168,.1)}
.l-log{border-color:var(--l-log);color:var(--l-log);background:rgba(90,100,112,.1)}
.reasons{margin:6px 0 0;padding-left:16px;font-family:var(--sans);font-size:12px;color:var(--dim)}
.aside{background:var(--ink-1);border-left:1px solid var(--line);overflow-y:auto;padding:16px 14px}
.entry{border:1px solid var(--line);border-left-width:3px;border-radius:2px;background:var(--ink-2);
  margin-bottom:8px;cursor:pointer}
.entry:hover{border-left-color:currentColor}
.entry .head{padding:9px 11px}
.entry .doc{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--paper);
  letter-spacing:.3px;line-height:1.4;word-break:break-all}
.entry .meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.entry .sec{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.entry .path{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:4px;word-break:break-all}
.entry .body{display:none;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;
  font-size:11.5px;color:var(--dim);max-height:320px;overflow-y:auto;line-height:1.75}
.entry.open .body{display:block}
.entry.e-route{border-left-color:var(--l-route)} .entry.e-knowledge{border-left-color:var(--l-knowledge)}
.entry.e-errata{border-left-color:var(--jade);background:rgba(74,156,133,.05)}
.entry.e-ledger{border-left-color:var(--l-ledger)} .entry.e-method{border-left-color:var(--l-method)}
.status{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--line);color:var(--faint)}
.status.l3,.status.l4{border-color:var(--seal-dim,#8E3223);color:var(--seal)}
.meter{width:54px;height:5px;background:var(--ink-0);border:1px solid var(--line);border-radius:1px;
  position:relative;overflow:hidden;flex:none}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--seal);display:block}
.readval{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
.stamp{font-family:var(--serif);font-size:10px;color:var(--jade);border:1px solid var(--jade);
  padding:0 5px;letter-spacing:1px}
.entry .body p{margin:0 0 7px} .entry .body b{color:var(--paper);font-weight:600}
.entry .body code{font-family:var(--mono);font-size:10.5px;color:#C08A3E;background:var(--ink-0);
  padding:1px 4px;border-radius:2px}
.entry .body h{display:block;font-family:var(--serif);font-size:12.5px;font-weight:700;
  color:var(--paper);margin:11px 0 6px}
.entry .body li{margin:2px 0;padding-left:13px;position:relative;list-style:none}
.entry .body li::before{content:"·";position:absolute;left:2px;color:var(--faint)}
.entry .body blockquote{margin:7px 0;padding:2px 0 2px 11px;border-left:2px solid var(--seal);color:var(--paper)}
.entry .body hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.entry .body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:10.5px;table-layout:fixed}
.entry .body table td{border:1px solid var(--line);padding:4px 7px;vertical-align:top;word-break:break-word}
.entry .body table td:first-child{width:24%}
.note{border:1px solid var(--line);border-left:2px solid var(--jade);background:var(--ink-1);
  border-radius:2px;padding:11px 14px;margin-bottom:14px;font-size:12px;color:var(--dim);line-height:1.8}
.note b{color:var(--paper)}
.empty{color:var(--faint);font-size:12px;text-align:center;padding:30px 8px;line-height:1.9}
:focus-visible{outline:2px solid #C08A3E;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="sealmark">研</div>
  <div class="brand">研发合规与研发费用管理<em>知识库</em></div>
  <span class="tag">静态演示 · 检索快照</span>
</header>

<div class="wrap">
  <nav class="qlist">
    <h3>演示问题</h3>
    <div id="qlist"></div>
  </nav>

  <main><div class="inner" id="main">
    <div class="empty">正在加载检索结果…</div>
  </div></main>

  <aside class="aside">
    <h3>出处登记簿</h3>
    <div id="ledger"><div class="empty">选左侧任一问题</div></div>
  </aside>
</div>

<script>
const LCN={route:'路由层',knowledge:'知识层',errata:'纠错层',ledger:'台账层',method:'治理层',log:'时间线'};
let DATA=[], cur=0;

fetch('./data/results.json').then(r=>r.json()).then(d=>{
  DATA=d; buildList(); show(0);
}).catch(e=>{
  document.getElementById('main').innerHTML=
    '<div class="empty">加载失败：'+esc(e)+'<br>请通过 HTTP 访问（不要直接打开文件）</div>';
});

function buildList(){
  const el=document.getElementById('qlist'); el.innerHTML='';
  DATA.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='qitem'+(i===0?' on':'');
    d.innerHTML=`<div class="qi">${esc(it.id)} · ${esc(it.note)}</div>
      <div class="qt">${esc(it.q.length>30?it.q.slice(0,30)+'…':it.q)}</div>`;
    d.onclick=()=>{ document.querySelectorAll('.qitem').forEach(x=>x.classList.remove('on'));
      d.classList.add('on'); show(i); };
    el.appendChild(d);
  });
}

function show(i){
  cur=i; const it=DATA[i]; const m=document.getElementById('main');
  const rt=it.retrieval||{};
  let h=`<div class="qq">${esc(it.q)}</div>
    <div class="qmeta">${esc(it.id)} · ${esc(it.note)} · 命中 ${it.sources.length} 条正文
      ${it.errata_warnings.length?' · '+it.errata_warnings.length+' 条纠错':''}</div>
    <div class="readout">
      <div class="layers">${(rt.layers||[]).map(l=>`<span class="ltag l-${l}">${esc(LCN[l]||l)}</span>`).join('')}</div>
      候选 ${rt.candidates||0} 块 · 融合 ${rt.fused||0} 块 · 向量 ${rt.dense?'开':'关'}
      ${rt.route_codes&&rt.route_codes.length?'<ul class="reasons">路由反推条目 '
        +rt.route_codes.slice(0,8).map(esc).join(' ')+'</ul>':''}
    </div>
    <div class="note"><b>这是静态检索快照。</b>页面数据由本地系统离线跑一遍分层检索后导出，
      已做敏感内容过滤。完整系统在此之外还有 LLM 生成层，按知识库系统提示词与输出契约
      组织成「结论先行 + 分口径 + 带出处」的回答。</div>
    <div class="qmeta">正文出处如下，右侧可逐条点开查看知识库原文。</div>`;
  it.sources.forEach(s=>{
    h+=`<div class="entry e-${s.layer}" style="cursor:default">
      <div class="head"><div class="doc">${esc(s.m_code||s.e_code)}</div>
      <div class="meta"><span class="ltag l-${s.layer}">${esc(LCN[s.layer]||s.layer)}</span>
      ${s.status?`<span class="status ${(s.status||'').toLowerCase()}">${esc(s.status)}</span>`:''}
      <span class="readval">${s.score}</span></div>
      <div class="sec">${esc(s.section||'')}</div>
      <div class="path">${esc(s.rel_path)}</div></div></div>`;
  });
  m.innerHTML=h; m.scrollTop=0;
  renderLedger(it);
}

function renderLedger(it){
  const el=document.getElementById('ledger'); el.innerHTML='';
  it.sources.forEach(s=>{
    const d=document.createElement('div'); d.className='entry e-'+s.layer;
    d.innerHTML=`<div class="head"><div class="doc">${esc(s.m_code||s.e_code)}</div>
      <div class="meta"><span class="ltag l-${s.layer}">${esc(LCN[s.layer]||s.layer)}</span>
      ${s.status?`<span class="status ${(s.status||'').toLowerCase()}">${esc(s.status)}</span>`:''}
      <div class="meter"><i style="width:${Math.max(4,Math.min(100,(s.score||0)*900))}%"></i></div>
      <span class="readval">${s.score}</span></div>
      <div class="sec">${esc(s.section||'')}</div>
      <div class="path">${esc(s.rel_path)}</div>
      ${s.doc_ids&&s.doc_ids.length?`<div class="path">文号 ${s.doc_ids.slice(0,5).map(esc).join(' · ')}</div>`:''}
      <div class="body">${md(s.text||'')}</div></div>`;
    d.onclick=()=>d.classList.toggle('open');
    el.appendChild(d);
  });
  if(it.errata_warnings&&it.errata_warnings.length){
    const h=document.createElement('h3'); h.textContent='纠错层 · 防污染'; h.style.marginTop='18px';
    el.appendChild(h);
    it.errata_warnings.forEach(w=>{
      const d=document.createElement('div'); d.className='entry e-errata';
      d.innerHTML=`<div class="head"><div class="doc">${esc(w.e_code||'过程笔记')}</div>
        <div class="meta"><span class="stamp">已勘误</span>
        <span class="readval">${w.score}</span></div>
        <div class="sec">${esc(w.section||'')}</div>
        <div class="body">${md(w.text||'')}</div></div>`;
      d.onclick=()=>d.classList.toggle('open');
      el.appendChild(d);
    });
  }
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function md(src){
  if(!src) return '';
  const lines=src.split('\n');
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const out=[]; let i=0;
  while(i<lines.length){
    const ln=lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln)){
      const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        const c=lines[i].trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
        if(!/^[-:\s]*$/.test(c.join(''))) rows.push(c);
        i++;
      }
      if(rows.length) out.push('<table>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</table>');
      continue;
    }
    if(/^#{1,4}\s/.test(ln)){out.push('<h>'+inline(ln.replace(/^#+\s*/,''))+'</h>');i++;continue;}
    if(/^\s*[-*]\s/.test(ln)){out.push('<li>'+inline(ln.replace(/^\s*[-*]\s*/,''))+'</li>');i++;continue;}
    if(/^\s*>\s?/.test(ln)){out.push('<blockquote>'+inline(ln.replace(/^\s*>\s?/,''))+'</blockquote>');i++;continue;}
    if(/^\s*(-{3,}|={3,})\s*$/.test(ln)){out.push('<hr>');i++;continue;}
    if(ln.trim()===''){i++;continue;}
    out.push('<p>'+inline(ln)+'</p>');i++;
  }
  return out.join('');
}
</script>
</body>
</html>
